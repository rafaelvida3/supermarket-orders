services:
  app:
    build:
      context: .
      target: dev
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - vendor_cache:/var/www/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: supermarket_orders
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
    command: >
      sh -c '
        set -e

        echo "Waiting for Postgres..."

        until pg_isready -h postgres -p 5432 -U postgres; do
          echo "Postgres not ready yet..."
          sleep 1
        done

        echo "Postgres is ready!"

        git config --global --add safe.directory /var/www

        if [ ! -f .env ]; then
          echo "No .env found - copying from .env.example..."
          cp .env.example .env
        fi

        if [ ! -d vendor ] || [ -z "$(ls -A vendor 2>/dev/null)" ]; then
          echo "Running composer install..."
          composer install --no-interaction --prefer-dist
        fi

        if ! grep -q "^APP_KEY=" .env || [ -z "$(grep "^APP_KEY=" .env | cut -d "=" -f2)" ]; then
          echo "Generating APP_KEY..."
          php artisan key:generate --force
        fi

        echo "Clearing Laravel config cache..."
        php artisan config:clear
        php artisan cache:clear

        echo "Running migrations..."
        php artisan migrate --force

        if ! php artisan tinker --execute="exit(App\\Models\\Product::exists() ? 0 : 1);" >/dev/null 2>&1; then
          echo "Importing products..."
          php artisan products:import
        fi

        echo "Starting Laravel server..."
        php artisan serve --host=0.0.0.0 --port=8000
      '

  frontend:
    image: node:20
    container_name: supermarket-orders-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c '
        set -e
        if [ ! -d node_modules ] || [ -z "$(ls -A node_modules 2>/dev/null)" ]; then
          echo "Installing dependencies..."
          npm install
        fi
        echo "Starting Vite dev server..."
        npm run dev -- --host 0.0.0.0 --port 5173
      '

  postgres:
    image: postgres:18
    container_name: supermarket-orders-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: supermarket_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  vendor_cache:
  node_modules_cache:
  postgres_data: