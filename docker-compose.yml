services:
  app:
    build:
      context: .
      target: dev
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - vendor_cache:/var/www/vendor
    depends_on:
      - postgres
    command: sh docker/app/start-app.sh

  frontend:
    image: node:24
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -c '
        set -e
        npm install
        echo "Starting Vite dev server..."
        npm run dev -- --host 0.0.0.0 --port 5173
      '

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: supermarket_orders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  vendor_cache:
  node_modules_cache:
  postgres_data:
